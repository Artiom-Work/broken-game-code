<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<link rel="icon" type="image/svg+xml" sizes="16x16" href="./images/icons/favicon.svg">
	<link rel="icon" type="image/svg+xml" sizes="32x32" href="./images/icons/favicon.svg">
	<link rel="icon" type="image/svg+xml" sizes="48x48" href="./images/icons/favicon.svg">
	<link rel="apple-touch-icon" sizes="180x180" href="./images/icons/favicon.svg">
	<!-- <meta name="description"
		content="Add your page description ..."> -->
	<link rel="stylesheet" href="./libs/iziModal/iziModal.min.css">
	<title>ohShitMyCodeBroken | Аренда</title>
	<link rel="stylesheet" href="./styles/css/style.css">
</head>

<body>

	<header class="header container">
		<div class="header__logo logo">
			<a class="logo__link" href="index.html" aria-label="Логотип" title="Логотип">OhShitMyCodeBroken</a>
		</div>


		<button class="header__night-mode-button night-mode-button" type="button" title="Кнопка День/Ночь">
			<span class="visually-hidden">
				Кнопка для переключения светлой или тёмной темы на сайте
			</span>
			<svg class="night-mode-button__image night-mode-button__image--sunny" viewBox="0 0 400 400" width="40"
				height="40">
				<use xlink:href="./images/icons/sprite-icons.svg#sun"></use>
			</svg>

			<svg class="night-mode-button__image night-mode-button__image--moon" viewBox="0 0 400 400" width="40" height="40">
				<use xlink:href="./images/icons/sprite-icons.svg#moon"></use>
			</svg>
		</button>

		<nav class="menu hidden-mobile">
			<ul class="menu__list">
				<li>
					<button class="menu__button button" data-izimodal-open="#new-rent" type="button"
						title="Активировать аренду">Новая аренда</button>
				</li>
				<li>
					<a class="menu__button button button--color-orange" href="faq.html" aria-label="Частые вопросы">Частые
						вопросы</a>
				</li>
				<li>
					<a class="menu__button button button--color-red menu__button--big-padding" href="problem.html"
						aria-label="Проблема">Проблема</a>
				</li>
			</ul>
		</nav>

		<div class="mobile-menu visible-mobile">
			<input id="menu-switch" type="checkbox">
			<label class="mobile-menu__burger" for="menu-switch">
				<span></span>
			</label>
			<div class="mobile-menu__wrapper">
				<nav class="mobile-menu__box">
					<ul class="menu__list">
						<li>
							<button class="menu__button button" data-izimodal-open="#new-rent" type="button"
								title="Активировать аренду">Новая аренда</button>
						</li>
						<li>
							<a class="menu__button button button--color-orange" href="faq.html" aria-label="Частые вопросы">Частые
								вопросы</a>
						</li>
						<li>
							<a class="menu__button button button--color-red menu__button--big-padding" href="problem.html"
								aria-label="Проблема">Проблема</a>
						</li>
					</ul>
				</nav>
			</div>
		</div>


	</header>

	<main>
		<h1 class="visually-hidden">OhShitMyCodeBroken</h1>

		<section class="empty container">
			<div class="empty__image-wrapper">
				<svg class="empty__image" viewBox="0 0 140 127" width="140" height="126">
					<use xlink:href="./images/icons/sprite-icons.svg#robot"></use>
				</svg>
			</div>

			<h2 class="empty__title">У&nbsp;вас нет активных аренд</h2>

			<div class="empty__text">
				<p>
					Нажмите на&nbsp;кнопку ниже, и&nbsp;введите код чтобы получить аккаунт
				</p>
			</div>

			<button class="empty__button button" data-izimodal-open="#new-rent" type="button"
				title="Создать новую аренда">Новая аренда</button>
		</section>


		<section class="user-rents container section section--main-page delete-element">
			<h2 class="user-rents__title section__title">Ваши аренды</h2>

			<ul class="user-rents__list"></ul>
		</section>

	</main>

	<dialog class="new-rent" id="new-rent" aria-label="Активация аренды">
		<h2 class="visually-hidden">Модальное окно для активации аренды</h2>
		<div class="decor-block decor-block--top">
			<svg class="decor-block__image decor-block__image--heart decor-block__image--heart-modal" viewBox="0 0 150 150"
				width="150" height="150">
				<use xlink:href="./images/icons/sprite-icons.svg#heart"></use>
			</svg>

			<svg class="decor-block__image decor-block__image--potion decor-block__image--potion-modal" viewBox="0 0 768 1024"
				width="134" height="179">
				<use xlink:href="./images/icons/sprite-icons.svg#potion"></use>
			</svg>
		</div>
		<header class="new-rent__header">
			<h3 class="new-rent__title">Активация аренды</h3>

			<button class="new-rent__close-button close-button" data-izimodal-close="" title="Закрыть модальное окно">
			</button>
		</header>

		<form class="new-rent__body" id="new-rent-form">
			<label class="visually-hidden" for="rent-number">Код пользователя</label>
			<input class="new-rent__input" type="text" name="rent-number" id="rent-number" maxlength="40"
				placeholder="введите код полученный на сайте" required>

			<label class="visually-hidden" for="user-message">Коментарий пользователя</label>
			<textarea class="new-rent__input new-rent__input--message" name="user-message" id="user-message" spellcheck="true"
				placeholder="Тут текст простой "></textarea>

			<button class="new-rent__button button" type="submit" title="Активировать новую аренду">Новая аренда</button>
		</form>

		<div class="decor-block decor-block--bottom">
			<svg class="decor-block__image decor-block__image--sword decor-block__image--sword-modal" viewBox="0 0 170 316"
				width="237" height="237">
				<use xlink:href="./images/icons/sprite-icons.svg#sword"></use>
			</svg>

			<svg class="decor-block__image decor-block__image--robot decor-block__image--robot-modal" viewBox="0 0 140 127"
				width="167" height="150">
				<use xlink:href="./images/icons/sprite-icons.svg#robot"></use>
			</svg>
		</div>

	</dialog>

	<script src="./libs/jquery/jquery-3.7.1.min.js"></script>
	<script src="./libs/iziModal/iziModal.min.js"></script>
	<script type="module" src="./js/main.js"></script>
</body>

</html>
